name: Documentation

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

#on: [push]
#on:
#  release:
#    types: [published, edited, prereleased, released]

jobs:
  changes:
    # Skip change detection for tags; release builds must always run.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    # Modify the default permissions granted to the GITHUB_TOKEN
    # see <https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions>
    permissions:
      contents: read
      pull-requests: read

    outputs:
      docs: ${{ steps.filter.outputs.docs }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'src/**'
              - 'Project.toml'
              - 'Manifest.toml'
              - 'Artifacts.toml'
              - '.github/workflows/DocDeploy.yml'

  build:
    name: Build and deploy docs
    needs: changes

    # Run for relevant changes, manual runs, and release tags.
    if: >-
      always() &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        needs.changes.outputs.docs == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # Modify the default permissions granted to the GITHUB_TOKEN
    # see <https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions>
    permissions:
      contents: write        # push to gh-pages
      pull-requests: read    # preview builds on PRs
      statuses: write        # documentation link status
      actions: write         # let julia-actions/cache delete stale caches
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      #- name: Install dependencies
      #  run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
