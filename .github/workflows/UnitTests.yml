name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the reference run, the one coverage is taken from
          - {os: ubuntu-latest, arch: x64,     julia-version: '1.12', coverage: true}
          # an Apple-silicon runner: note the aarch64 arch, since an x86_64 Julia
          # running under Rosetta 2 produces spurious DomainErrors from `cos`
          - {os: macos-latest,  arch: aarch64, julia-version: '1.12', coverage: false}
          #- {os: windows-latest, arch: x64,   julia-version: '1.12', coverage: false}
    steps:
      - uses: actions/checkout@v4
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - name: "Cache artifacts"
        uses: julia-actions/cache@v2
      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1
      - name: "Run unit tests"
        uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v4
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
