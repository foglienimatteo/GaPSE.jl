name: Unit tests

#on: [push]

#on:
#  release:
#    types: [published, edited, prereleased, released]

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Modify the default permissions granted to the GITHUB_TOKEN
# see <https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions>
permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}

    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        # dorny/paths-filter@v4 uses GitHub's API to discover changed files for pull_request events,
        # => it does not need a repository checkout for that job
        #with:
        #  fetch-depth: 0

      # see <https://github.com/dorny/paths-filter#usage>
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            tests:
              - 'src/**'
              - 'test/**'
              - 'data/**'
              - 'Project.toml'
              - 'Manifest.toml'
              - 'Artifacts.toml'
              - 'ext/**'
              - 'deps/**'
              - '.github/workflows/UnitTests.yml'

  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.threads }} thread(s)
    needs: changes
    if: needs.changes.outputs.tests == 'true'

    runs-on: ${{ matrix.os }}
    env:
      # Read by Julia itself to size the default thread pool
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Reference run; coverage is taken from this
          - {os: ubuntu-latest, arch: x64,     julia-version: '1.12', threads: 1, coverage: true}
          # Apple-silicon runner: note the aarch64 arch, since an x86_64 Julia
          # running under Rosetta 2 produces spurious DomainErrors from "cos"
          - {os: macos-latest,  arch: aarch64, julia-version: '1.12', threads: 1, coverage: false}
          # Check actual multi-threaded execution.
          # "4" is a literal and not "auto" on purpose: "auto" would silently become
          # "1" on a smaller runner, and a 1-thread run is what the first entry already does
          - {os: ubuntu-latest, arch: x64,     julia-version: '1.12', threads: 4, coverage: false}
          #- {os: windows-latest, arch: x64,   julia-version: '1.12', threads: 1, coverage: false}
    steps:
      - uses: actions/checkout@v4
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - name: "Cache artifacts"
        uses: julia-actions/cache@v2
      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1
      - name: "Run unit tests"
        uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v4
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  test-status:
    name: Unit tests status
    needs: [changes, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify test outcome
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TESTS_NEEDED: ${{ needs.changes.outputs.tests }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection did not succeed."
            exit 1
          fi

          if [[ "$TESTS_NEEDED" == "true" ]]; then
            if [[ "$TEST_RESULT" != "success" ]]; then
              echo "::error::Tests were required but result was $TEST_RESULT."
              exit 1
            fi
          else
            if [[ "$TEST_RESULT" != "skipped" &&
                  "$TEST_RESULT" != "success" ]]; then
              echo "::error::Unexpected test result: $TEST_RESULT."
              exit 1
            fi
          fi

          echo "Tests passed or were correctly skipped."

